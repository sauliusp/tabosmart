name: Validate extension and website
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: mkdir -p qa/screenshots
      - run: npx playwright install --with-deps chromium
      - run: npm run qa:browser
      - run: npm run qa:workspace
      - run: npm run pack
  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
